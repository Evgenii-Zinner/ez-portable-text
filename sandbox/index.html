<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ez-portable-text Sandbox</title>
    <!-- Load UMD Stylesheet (if any) -->
    <link rel="stylesheet" href="../dist/ez-portable-text.umd.css" />

    <style>
      :root {
        --bg-primary: #0a0a0c;
        --bg-secondary: #121216;
        --text-primary: #f3f4f6;
        --text-secondary: #9ca3af;
        --accent: #10b981;
        --border: rgba(255, 255, 255, 0.08);
        --font-sans: "Inter", system-ui, -apple-system, sans-serif;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-primary);
        color: var(--text-primary);
        font-family: var(--font-sans);
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
      }

      header {
        background-color: var(--bg-secondary);
        border-bottom: 1px solid var(--border);
        padding: 16px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
        color: var(--text-primary);
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .badge {
        background-color: rgba(16, 185, 129, 0.1);
        color: var(--accent);
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 9999px;
        border: 1px solid rgba(16, 185, 129, 0.2);
      }

      main {
        flex: 1;
        display: grid;
        grid-template-columns: 1fr 1fr;
        overflow: hidden;
      }

      .editor-section,
      .json-section {
        display: flex;
        flex-direction: column;
        overflow: hidden;
        padding: 24px;
        box-sizing: border-box;
      }

      .editor-section {
        border-right: 1px solid var(--border);
      }

      .section-title {
        font-size: 13px;
        font-weight: 500;
        color: var(--text-secondary);
        margin-bottom: 12px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .editor-wrapper {
        flex: 1;
        overflow-y: auto;
        border-radius: 8px;
        background: white; /* Editor needs white background usually */
        color: black;
        padding: 1rem;
      }

      #json-output {
        flex: 1;
        background-color: var(--bg-secondary);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 16px;
        font-family: "JetBrains Mono", "Fira Code", monospace;
        font-size: 14px;
        color: #34d399; /* Emerald light green */
        white-space: pre-wrap;
        overflow-y: auto;
        margin: 0;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>ez-portable-text <span class="badge">Sandbox v4.0</span></h1>
      <div>
        <span style="color: var(--text-secondary); font-size: 13px"
          >Preact Web Component</span
        >
      </div>
    </header>

    <main>
      <section class="editor-section">
        <div class="section-title">Visual Editor Canvas</div>
        <div class="editor-wrapper">
          <!-- Web Component Mount -->
          <ez-portable-text id="editor-mount"></ez-portable-text>
        </div>
      </section>

      <section class="json-section">
        <div class="section-title">Live PortableText Output</div>
        <pre id="json-output">Initializing...</pre>
      </section>
    </main>

    <!-- Load UMD Bundle -->
    <script src="../dist/ez-portable-text.umd.js"></script>
    <script>
      // Initial PortableText content
      const initialData = [
        {
          _key: "b1a2",
          _type: "block",
          style: "normal",
          children: [
            {
              _key: "s1",
              _type: "span",
              marks: [],
              text: "Welcome to the ez-portable-text sandbox! Try editing this text.",
            },
          ],
          markDefs: [],
        },
        {
          _key: "b3c4",
          _type: "block",
          style: "normal",
          children: [
            {
              _key: "s2",
              _type: "span",
              marks: [],
              text: "This editor uses Preact internally but exposes a native Web Component.",
            },
          ],
          markDefs: [],
        },
      ];

      const jsonOutput = document.getElementById("json-output");
      const editorElement = document.getElementById("editor-mount");

      // Helper to print formatted JSON
      const updateOutput = (data) => {
        jsonOutput.textContent = JSON.stringify(data, null, 2);
      };

      // Register custom 'hero' block type on mount
      editorElement.registerBlockType({
        name: "hero",
        title: "Hero Banner",
        icon: "⚡",
        defaultValue: {
          title: "Welcome to CMS Title",
          subtitle: "CMS Subtitle",
        },
      });

      // Set initial value
      editorElement.value = initialData;
      updateOutput(initialData);

      // Listen for custom change events
      editorElement.addEventListener("change", (e) => {
        updateOutput(e.detail.value);
      });

      // Handle the CMS event-bridge mock editing flow
      editorElement.addEventListener("edit-block", (e) => {
        const { value, update } = e.detail;
        const blockType = value._type;

        if (blockType === "image") {
          const url = prompt(
            "Enter image URL:",
            value.url ||
              "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=800&auto=format&fit=crop&q=60",
          );
          const alt = prompt(
            "Enter alt text:",
            value.alt || "Abstract gradient",
          );
          const caption = prompt(
            "Enter caption:",
            value.caption || "Beautiful digital artwork",
          );
          if (url !== null) {
            update({ url, alt, caption });
          }
        } else if (blockType === "video") {
          const url = prompt(
            "Enter video embed/URL:",
            value.url || "https://www.youtube.com/watch?v=dQw4w9WgXcQ",
          );
          const caption = prompt(
            "Enter caption:",
            value.caption || "Never Gonna Give You Up",
          );
          if (url !== null) {
            update({ url, caption });
          }
        } else if (blockType === "codeBlock") {
          const code = prompt(
            "Enter code:",
            value.code ||
              "const greeting = 'Hello, Edge CMS!';\nconsole.log(greeting);",
          );
          const language = prompt(
            "Enter programming language:",
            value.language || "javascript",
          );
          const filename = prompt(
            "Enter filename:",
            value.filename || "main.js",
          );
          if (code !== null) {
            update({ code, language, filename });
          }
        } else if (blockType === "hero") {
          const title = prompt("Enter Hero Title:", value.title || "");
          const subtitle = prompt("Enter Hero Subtitle:", value.subtitle || "");
          if (title !== null) {
            update({ title, subtitle });
          }
        } else if (blockType === "table") {
          // Table data edit demo
          const cell0 = prompt(
            "Enter value for row 1, col 1:",
            value.rows?.[0]?.cells?.[0] || "",
          );
          const cell1 = prompt(
            "Enter value for row 1, col 2:",
            value.rows?.[0]?.cells?.[1] || "",
          );
          if (cell0 !== null && cell1 !== null) {
            const rows = JSON.parse(JSON.stringify(value.rows || []));
            if (rows[0]) {
              rows[0].cells = [cell0, cell1];
            }
            update({ rows });
          }
        } else {
          // Generic fallback edit fields loop
          const keys = Object.keys(value).filter((k) => !k.startsWith("_"));
          const updated = { ...value };
          let cancelled = false;
          for (const k of keys) {
            const newVal = prompt(`Enter value for field "${k}":`, value[k]);
            if (newVal === null) {
              cancelled = true;
              break;
            }
            updated[k] = newVal;
          }
          if (!cancelled) {
            update(updated);
          }
        }
      });
    </script>
  </body>
</html>
